<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Unity WebGL | %UNITY_WEB_NAME%</title>

  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/profiler.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #unity-footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
    }
  </style>
</head>

<body>

<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="unity-loading-bar">
    <div id="unity-logo"></div>
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>

  <div id="unity-warning"></div>

  <div id="unity-footer">
    <div id="unity-logo-title-footer"></div>
    <div id="unity-fullscreen-button"></div>
    <div id="unity-build-title">%UNITY_WEB_NAME%</div>
  </div>
</div>

<script>
  const canvas = document.querySelector("#unity-canvas");

  function unityShowBanner(msg, type) {
    const warning = document.querySelector("#unity-warning");

    const div = document.createElement("div");
    div.innerHTML = msg;

    if (type === "error") div.style = "background:red;padding:10px;";
    if (type === "warning") div.style = "background:yellow;padding:10px;";

    warning.appendChild(div);

    setTimeout(() => {
      warning.removeChild(div);
    }, 5000);
  }

  const buildUrl = "Build";

  const config = {
    dataUrl: buildUrl + "/AstrologyWeb-build.data",
    frameworkUrl: buildUrl + "/AstrologyWeb-build.framework.js",
    codeUrl: buildUrl + "/AstrologyWeb-build.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "%UNITY_COMPANY_NAME%",
    productName: "%UNITY_PRODUCT_NAME%",
    productVersion: "%UNITY_PRODUCT_VERSION%",
    showBanner: unityShowBanner
  };

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    document.querySelector("#unity-container").className = "unity-mobile";
    canvas.className = "unity-mobile";
  }

  document.querySelector("#unity-loading-bar").style.display = "block";

  const script = document.createElement("script");
  script.src = buildUrl + "/AstrologyWeb-build.loader.js";

  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
    }).then((unityInstance) => {

      document.querySelector("#unity-loading-bar").style.display = "none";

      document.querySelector("#unity-fullscreen-button").onclick = () => {
        unityInstance.SetFullscreen(1);
      };

    }).catch(alert);
  };

  document.body.appendChild(script);
</script>

</body>
</html>
